# Local datastores for Kanzen development.
#   docker compose up -d
# Then: cp .env.example .env  &&  pnpm install  &&  pnpm seed  &&  pnpm dev
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - kanzen_mongo:/data/db
    command: ['--quiet']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - kanzen_redis:/data

volumes:
  kanzen_mongo:
  kanzen_redis:
