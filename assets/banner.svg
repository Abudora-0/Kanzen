<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Kanzen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022" />
      <stop offset="1" stop-color="#0f1630" />
    </linearGradient>
    <radialGradient id="aurora" cx="20%" cy="0%" r="90%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.18" />
      <stop offset="1" stop-color="#0b1022" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9ecff" />
      <stop offset="1" stop-color="#b9c1e8" />
    </linearGradient>
  </defs>

  <rect width="960" height="280" rx="20" fill="url(#sky)" />
  <rect width="960" height="280" rx="20" fill="url(#aurora)" />

  <!-- star field -->
  <g fill="#c7d2fe">
    <circle cx="120" cy="60" r="1.4" opacity="0.7" />
    <circle cx="300" cy="40" r="1" opacity="0.5" />
    <circle cx="620" cy="70" r="1.6" opacity="0.8" />
    <circle cx="800" cy="46" r="1.1" opacity="0.6" />
    <circle cx="880" cy="120" r="1.3" opacity="0.7" />
    <circle cx="70" cy="200" r="1.2" opacity="0.6" />
    <circle cx="900" cy="220" r="1.4" opacity="0.7" />
  </g>

  <!-- torii mark, raising itself on a loop -->
  <g transform="translate(90 60)">
    <line x1="10" y1="150" x2="110" y2="150" stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity="0.55" />
    <g fill="#e2542f">
      <rect x="26" width="14" rx="3">
        <animate attributeName="y" values="150;150;28;28;150" keyTimes="0;0.05;0.32;0.9;1" dur="6s" repeatCount="indefinite" />
        <animate attributeName="height" values="0;0;122;122;0" keyTimes="0;0.05;0.32;0.9;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <rect x="80" width="14" rx="3">
        <animate attributeName="y" values="150;150;28;28;150" keyTimes="0;0.08;0.35;0.9;1" dur="6s" repeatCount="indefinite" />
        <animate attributeName="height" values="0;0;122;122;0" keyTimes="0;0.08;0.35;0.9;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <rect x="57" y="22" width="6" height="30" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.9;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <path d="M0 26 Q60 6 120 26 L120 12 Q60 -8 0 12 Z" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.44;0.9;1" dur="6s" repeatCount="indefinite" />
      </path>
    </g>
    <rect x="12" y="48" width="96" height="12" rx="3" fill="#a5371b" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.52;0.9;1" dur="6s" repeatCount="indefinite" />
    </rect>
    <circle r="5" fill="#a78bfa">
      <animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M-14 40 H134" />
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.4;0.55;0.62;1" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- wordmark -->
  <text x="272" y="150" font-family="'Zen Kaku Gothic New', 'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" font-size="68" letter-spacing="18" fill="url(#ink)">KANZEN</text>
  <text x="274" y="192" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="6" fill="#7f8bbd">UNIFIED MEDIA AND CROSS-PLATFORM TRACKER</text>

  <!-- constellation flourish -->
  <g stroke="#3b4a86" stroke-width="1" fill="none">
    <path d="M300 232 L360 214 L410 240 L470 220 L540 244" />
  </g>
  <g fill="#5eead4">
    <circle cx="300" cy="232" r="3" />
    <circle cx="410" cy="240" r="3.4" />
    <circle cx="540" cy="244" r="2.6" />
  </g>
</svg>
