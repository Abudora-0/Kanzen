<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Kanzen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022" />
      <stop offset="1" stop-color="#0f1630" />
    </linearGradient>
    <radialGradient id="aurora" cx="20%" cy="0%" r="90%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.18" />
      <stop offset="1" stop-color="#0b1022" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9ecff" />
      <stop offset="1" stop-color="#b9c1e8" />
    </linearGradient>
  </defs>

  <rect width="960" height="280" rx="20" fill="url(#sky)" />
  <rect width="960" height="280" rx="20" fill="url(#aurora)" />

  <!-- star field -->
  <g fill="#c7d2fe">
    <circle cx="120" cy="60" r="1.4" opacity="0.7" />
    <circle cx="300" cy="40" r="1" opacity="0.5" />
    <circle cx="620" cy="70" r="1.6" opacity="0.8" />
    <circle cx="800" cy="46" r="1.1" opacity="0.6" />
    <circle cx="880" cy="120" r="1.3" opacity="0.7" />
    <circle cx="70" cy="200" r="1.2" opacity="0.6" />
    <circle cx="900" cy="220" r="1.4" opacity="0.7" />
  </g>

  <!-- enso mark -->
  <g transform="translate(150 140)">
    <circle r="58" fill="none" stroke="#5eead4" stroke-width="1.4" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="58" cy="0" r="5" fill="#a78bfa">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </circle>
    <path d="M42 -26 A46 46 0 1 1 -14 -42" fill="none" stroke="#e2542f" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0;0;300" keyTimes="0;0.45;0.9;1" dur="6s" repeatCount="indefinite" />
    </path>
    <circle r="6" fill="#e9ecff" />
  </g>

  <!-- wordmark -->
  <text x="270" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="14" fill="url(#ink)">KANZEN</text>
  <text x="272" y="196" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="6" fill="#7f8bbd">UNIFIED MEDIA AND CROSS-PLATFORM TRACKER</text>

  <!-- constellation flourish -->
  <g stroke="#3b4a86" stroke-width="1" fill="none">
    <path d="M300 232 L360 214 L410 240 L470 220 L540 244" />
  </g>
  <g fill="#5eead4">
    <circle cx="300" cy="232" r="3" />
    <circle cx="410" cy="240" r="3.4" />
    <circle cx="540" cy="244" r="2.6" />
  </g>
</svg>
